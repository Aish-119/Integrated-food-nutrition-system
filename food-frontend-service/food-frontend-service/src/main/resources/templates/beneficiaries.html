<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Beneficiary Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Beneficiaries Management</h2>
            <a href="/" class="btn btn-secondary btn-sm">â† Back to Dashboard</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Registered Beneficiaries</h5>
                <a href="/beneficiaries/add" class="btn btn-light btn-sm fw-bold">+ Add Beneficiary</a>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Household Size</th>
                            <th>Nutrition Needs</th>
                            <th>Address</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loops through model attribute sent by backend teammate -->
                        <tr th:each="b : ${beneficiaries}">
                            <td th:text="${b.id}">1</td>
                            <td th:text="${b.name}">John Doe</td>
                            <td th:text="${b.age}">35</td>
                            <td th:text="${b.householdSize}">4</td>
                            <td th:text="${b.nutritionNeeds}">High Protein</td>
                            <td th:text="${b.address}">123 Street Name</td>
                        </tr>
                        <!-- Fallback if database table is empty -->
                        <tr th:if="${#lists.isEmpty(beneficiaries)}">
                            <td colspan="6" class="text-center text-muted">No beneficiaries found in the database.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
