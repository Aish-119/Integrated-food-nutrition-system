<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Beneficiary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5" style="max-width: 650px;">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">Register Beneficiary</h3>
            </div>

            <div class="card-body">
                <p class="text-danger" th:if="${error}" th:text="${error}"></p>

                <form th:action="@{/beneficiaries/save}" th:object="${beneficiary}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input class="form-control" type="text" th:field="*{name}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        <input class="form-control" type="number" th:field="*{age}" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Household Size</label>
                        <input class="form-control" type="number" th:field="*{householdSize}" min="1" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nutrition Needs</label>
                        <textarea class="form-control" th:field="*{nutritionNeeds}" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" th:field="*{address}" required></textarea>
                    </div>

                    <button class="btn btn-success" type="submit">
                        Save Beneficiary
                    </button>
                    <a class="btn btn-secondary" th:href="@{/beneficiaries}">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
