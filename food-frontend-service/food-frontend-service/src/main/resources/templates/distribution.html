<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Food Distribution Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Food Distribution Plans & Tracking</h2>
            <a href="/" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Distribution Records</h5>
                <button type="button" class="btn btn-light btn-sm fw-bold" disabled>
                    Distribution Plan Creation Not Connected
                </button>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Distribution ID</th>
                            <th>Beneficiary ID</th>
                            <th>Distribution Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="dist : ${distributionsList}">
                            <td th:text="${dist.id}">1</td>
                            <td th:text="${dist.beneficiary_id}">42</td>
                            <td th:text="${dist.distribution_date}">2026-10-12</td>
                            <td>
                                <span class="badge bg-warning text-dark" th:text="${dist.status}">Pending Stock
                                    Check</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(distributionsList)}">
                            <td colspan="4" class="text-center text-muted">No distribution records found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
