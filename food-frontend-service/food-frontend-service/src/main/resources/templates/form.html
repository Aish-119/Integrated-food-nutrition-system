<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Inventory Batch</title>
</head>

<body>
    <h1>Add Inventory Batch</h1>

    <p th:if="${error}" th:text="${error}" style="color:red;"></p>

    <form th:action="@{/save}" th:object="${foodItem}" method="post">
        <p>
            <label>Food Item ID:</label>
            <input type="number" th:field="*{foodItemId}" min="1" required>
        </p>

        <p>
            <label>Batch Number:</label>
            <input type="text" th:field="*{batchNumber}" required>
        </p>

        <p>
            <label>Quantity:</label>
            <input type="number" th:field="*{quantity}" min="0.01" step="0.01" required>
        </p>

        <p>
            <label>Unit:</label>
            <input type="text" th:field="*{unit}" placeholder="KG, L, PACK..." required>
        </p>

        <p>
            <label>Received Date:</label>
            <input type="date" th:field="*{receivedDate}">
        </p>

        <p>
            <label>Expiry Date:</label>
            <input type="date" th:field="*{expiryDate}">
        </p>

        <button type="submit">Save Batch</button>
    </form>

    <p><a th:href="@{/inventory}">Back to Inventory</a></p>
    <p><a th:href="@{/}">Home</a></p>
</body>

</html>
