<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Add New Entry</h4>
            </div>
            <div class="card-body">
                <!-- Submits data via POST to your backend controller -->
                <form th:action="@{/save}" method="post">
                    
                    <div class="mb-3">
                        <label class="form-label">Name / Batch Number</label>
                        <input type="text" name="name" class="form-control" placeholder="Enter name or batch number" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Details / Quantity</label>
                        <input type="text" name="quantity" class="form-control" placeholder="Enter quantity or details" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category / Nutrition Needs</label>
                        <input type="text" name="details" class="form-control" placeholder="Enter category or requirements" required />
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Save to Database</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
