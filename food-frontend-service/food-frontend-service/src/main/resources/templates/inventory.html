<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Inventory & Stock Batches</h2>
            <a href="/" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Stock Batches</h5>
                <a href="/inventory/add" class="btn btn-light btn-sm fw-bold">+ Add Stock Batch</a>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Batch Number</th>
                            <th>Quantity</th>
                            <th>Unit</th>
                            <th>Received Date</th>
                            <th>Expiry Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Loops through inventory list from backend -->
                        <tr th:each="item : ${inventoryList}">
                            <td th:text="${item.id}">1</td>
                            <td th:text="${item.batch_number}">BATCH-001</td>
                            <td th:text="${item.quantity}">500.00</td>
                            <td th:text="${item.unit}">KG</td>
                            <td th:text="${item.received_date}">2026-10-01</td>
                            <td th:text="${item.expiry_date}">2027-10-01</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(inventoryList)}">
                            <td colspan="6" class="text-center text-muted">No inventory stock found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
