<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Inventory & Stock Batches</title>
</head>

<body>
    <h1>Inventory & Stock Batches</h1>

    <p th:if="${error}" th:text="${error}" style="color:red;"></p>

    <p><a th:href="@{/}">Home</a></p>
    <p><a th:href="@{/form}">Add Inventory Batch</a></p>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Food Item ID</th>
                <th>Batch Number</th>
                <th>Quantity</th>
                <th>Unit</th>
                <th>Received Date</th>
                <th>Expiry Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.foodItem != null ? item.foodItem.id : item.foodItemId}"></td>
                <td th:text="${item.batchNumber}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.unit}"></td>
                <td th:text="${item.receivedDate}"></td>
                <td th:text="${item.expiryDate}"></td>
                <td>
                    <a th:href="@{/delete/{id}(id=${item.id})}"
                        onclick="return confirm('Delete this batch?');">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="8">No inventory batches found.</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
