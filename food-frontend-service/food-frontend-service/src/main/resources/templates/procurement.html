<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Procurement Management</title>
</head>

<body>

    <h1>Procurement Management</h1>

    <p>
        <a th:href="@{/}">Home</a> |
        <a th:href="@{/inventory}">Inventory</a> |
        <a th:href="@{/beneficiaries}">Beneficiaries</a>
    </p>

    <p style="color:green" th:if="${success}" th:text="${success}"></p>
    <p style="color:red" th:if="${error}" th:text="${error}"></p>

    <h2>Record Procurement</h2>

    <form th:action="@{/procurement/create}" method="post">

        <p>
            <label>Food Item:</label><br>
            <select name="foodItemId" required>
                <option value="">Select food item</option>
                <option th:each="f : ${foodItems}" th:value="${f['id']}"
                    th:text="${f['name'] + ' (ID: ' + f['id'] + ')'}">
                </option>
            </select>
        </p>

        <p>
            <label>Quantity:</label><br>
            <input type="number" name="quantity" min="0.01" step="0.01" required>
        </p>

        <p>
            <label>Supplier:</label><br>
            <input type="text" name="supplier" required>
        </p>

        <p>
            <label>Procurement Date:</label><br>
            <input type="date" name="procurementDate" th:value="${today}" required>
        </p>

        <button type="submit">Save Procurement</button>
    </form>

    <h2>Recorded Procurements</h2>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Food Item</th>
                <th>Quantity</th>
                <th>Supplier</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="p : ${procurements}">
                <td th:text="${p['id']}"></td>
                <td th:text="${p['foodItem'] != null
                ? p['foodItem']['name'] : 'Unknown'}"></td>
                <td th:text="${p['quantity']}"></td>
                <td th:text="${p['supplier']}"></td>
                <td th:text="${p['procurementDate']}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(procurements)}">
                <td colspan="5">No procurement records yet.</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
