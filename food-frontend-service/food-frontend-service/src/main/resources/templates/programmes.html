<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nutrition Programmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Nutrition Programme Management</h2>
            <a href="/" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Active Programmes & Meal Plans</h5>
                <a href="/programmes/add" class="btn btn-light btn-sm fw-bold">+ Add Programme</a>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Programme Name</th>
                            <th>Description</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prog : ${programmesList}">
                            <td th:text="${prog.id}">1</td>
                            <td th:text="${prog.name}">Mid-Day Meal Scheme</td>
                            <td th:text="${prog.description}">Providing high-protein lunch to local schools</td>
                            <td th:text="${prog.start_date}">2026-01-01</td>
                            <td th:text="${prog.end_date}">2026-12-31</td>
                            <td><span class="badge bg-success" th:text="${prog.status}">Active</span></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(programmesList)}">
                            <td colspan="6" class="text-center text-muted">No nutrition programmes found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
